name: Docs (delete version on tag removal)

on:
  delete:

permissions:
  contents: write

jobs:
  delete-version:
    if: github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Derive version from deleted tag
        id: ver
        run: |
          TAG="${{ github.event.ref }}"          # e.g. v8.0.0
          VERSION="${TAG#v}"                     # -> 8.0.0
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must be v<semver>, got: $TAG"; exit 1
          fi
          echo "v=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout (needed for git remote + mike pushes)
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Python and mike
        uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Delete matching docs branch (version/X.Y.Z) if it exists
        run: |
          BR="version/${{ steps.ver.outputs.v }}"
          if git ls-remote --heads origin "$BR" | grep -q "$BR"; then
            echo "Deleting branch $BR"
            git push origin --delete "$BR"
          else
            echo "Branch $BR not found. Skipping."
          fi

      - name: Remove version from gh-pages with mike
        run: |
          VERSION="${{ steps.ver.outputs.v }}"
          # NOTE: if any alias (e.g. latest/stable) points at this version,
          # mike will fail the deletion. Repoint aliases first (see note below).
          mike delete --push "$VERSION"
