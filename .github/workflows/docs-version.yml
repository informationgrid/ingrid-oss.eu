name: Docs (version branches)

on:
  push:
    branches:
      - 'version/*'

permissions:
  contents: write

jobs:
  deploy-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Infer version from branch name
        id: ver
        run: |
          BR="${GITHUB_REF_NAME}"       # e.g., version/8.0.0
          VERSION="${BR#version/}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Branch must be version/<semver>, got: $BR"; exit 1
          fi
          echo "v=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git author
        run: git config user.name "github-actions[bot]"

      - name: Deploy version (no alias move)
        run: |
          mike deploy --push "${{ steps.ver.outputs.v }}"
