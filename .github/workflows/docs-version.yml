name: Docs (version branches)

on:
  push:
    branches:
      - 'version/*'

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hard tabs in Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          config: '.markdownlint-cli2.yaml'
          globs: |
            docs/**/*.md
            README.md

      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build docs (strict)
        run: mkdocs build --strict

  deploy-version:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Infer version from branch name
        id: ver
        run: |
          BR="${GITHUB_REF_NAME}"       # e.g., version/8.0.0
          VERSION="${BR#version/}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Branch must be version/<semver>, got: $BR"; exit 1
          fi
          echo "v=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy version (no alias move)
        run: |
          mike deploy --push "${{ steps.ver.outputs.v }}"
