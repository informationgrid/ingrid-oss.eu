name: Docs (draft)

on:
  push:
    branches: [ draft ]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hard tabs in Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          config: '.markdownlint-cli2.yaml'
          globs: |
            docs/**/*.md
            README.md

      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build docs (strict)
        run: mkdocs build --strict

  deploy-draft:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Read draft version
        id: ver
        run: |
          if [ ! -f .docs-version ]; then
            echo "Missing .docs-version (e.g., 8.1.0)"; exit 1
          fi
          VERSION="$(cat .docs-version | tr -d '[:space:]')"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version in .docs-version: $VERSION"; exit 1
          fi
          echo "v=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy draft (versioned) + alias 'draft'
        run: |
          mike deploy --push --update-aliases --prop-set hidden=true "${{ steps.ver.outputs.v }}" draft
