description:
  de:
    localisedName: InGrid
    genericName: Metadaten- und Geodatenkatalog
    shortDescription: >
      Modulare Open-Source-Plattform zur Erfassung, Verwaltung und
      Veröffentlichung von Daten und Metadaten für Geodaten- und
      Open-Data-Portale.
    longDescription: >
      InGrid (InformationGrid) ist eine modulare Softwareplattform zur
      Erfassung, Verwaltung, Recherche und Veröffentlichung von Daten und
      Metadaten. Kernbestandteile sind ein Webportal, eine Suchmaschine sowie
      ein Metadatenkatalog mit Profilen für INSPIRE-konforme Metadaten,
      Open-Data-Datensätze und UVP-Projekte (Umweltverträglichkeitsprüfung).
      Ergänzt wird die Plattform durch eine Visualisierungskomponente für
      OGC Web Map Services sowie einen Client zur Darstellung von
      Zeitreihendaten. Über verschiedene standardisierte Zugriffs- und
      Abfrageschnittstellen (u. a. OGC CSW, OpenSearch, DCAT-AP.DE) lassen
      sich angeschlossene Systeme durchsuchen und Ergebnisse an externe
      Portale wie das Geoportal Deutschland, GovData oder das
      INSPIRE-Geoportal weitergeben. InGrid wird insbesondere von
      Behörden und öffentlichen Verwaltungen zum Betrieb von
      Internetportalen und Metadatenkatalogen eingesetzt.
    features:
      - Web-Portal für Recherche und Volltextsuche
      - Metadateneditor (InGrid Editor / IGE) für ISO 19115/19119, OGC- und INSPIRE-konforme Metadaten
      - Open-Data-Erfassung und -Bereitstellung im DCAT-AP.DE-Format
      - Erfassung und Publikation von UVP-Verfahren
      - Kartenvisualisierung über OGC Web Map Services
      - Zeitreihen-Client (OGC SensorThings API)
      - Standardisierte Schnittstellen (OGC CSW, OpenSearch)
      - Harvester zur Anbindung externer Datenquellen
  en:
    localisedName: InGrid
    genericName: Metadata and geodata catalogue
    shortDescription: >
      Modular open source platform for capturing, managing and publishing
      data and metadata for geodata and open data portals.
    longDescription: >
      InGrid (InformationGrid) is a modular software platform for capturing,
      managing, searching and publishing data and metadata. Core components
      include a web portal, a search engine and a metadata catalogue with
      profiles for INSPIRE-compliant metadata, open data records and
      environmental impact assessment (EIA) projects. The platform also
      includes a visualisation component for OGC Web Map Services and a
      client for displaying time series data. Standardised access and query
      interfaces (e.g. OGC CSW, OpenSearch, DCAT-AP.DE) allow connected
      systems to be searched and results forwarded to external portals such
      as Geoportal Deutschland, GovData or the INSPIRE Geoportal. InGrid is
      primarily used by public administrations to operate web portals and
      metadata catalogues.
    features:
      - Web portal with full-text and thesaurus-based search
      - InGrid Editor (IGE) for ISO 19115/19119, OGC and INSPIRE compliant metadata
      - Open data capture and publication in DCAT-AP.DE format
      - Capture and publication of environmental impact assessments
      - Map visualisation via OGC Web Map Services
      - Time series client (OGC SensorThings API)
      - Standardised interfaces (OGC CSW, OpenSearch)
      - Harvester for connecting external data sources

