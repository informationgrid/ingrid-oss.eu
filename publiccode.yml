description:
  de:
    localisedName: InGrid
    genericName: Metadaten- und Geodatenkatalog
    shortDescription: >
      Modulare Open-Source-Plattform zur Erfassung, Verwaltung und
      Bereitstellung von Daten und Metadaten.
    longDescription: >
      InGrid ist eine leistungsstarke und flexible Softwarelösung für die Erfassung, Verwaltung und Bereitstellung
      von Daten und Metadaten. Der Name vereint "Information" und "Grid" und steht für die strukturierte, effiziente
      Organisation und Vernetzung komplexer Datenbestände. Entwickelt für Geo- und Umweltportale, Open Data-Plattformen
      und Verwaltungsanwendungen, ermöglicht InGrid den Aufbau von skalierbaren Infrastrukturen, die sich nahtlos
      in bestehende Systeme integrieren.
      
      Pflege und Weiterentwicklung erfolgen kontinuierlich und bedarfsorientiert innerhalb einer
      Bund-Länder-Verwaltungskooperation und berücksichtigen individuelle Anforderungen der Kooperationspartner.
      
      
      Weiterführende Links:
      
      - [Dokumentation](https://ingrid-oss.eu/latest/)
      
      - [Infos zum Projekt](https://ingrid-oss.eu/latest/contributing/organisation/)
      
      - [Projektpartner](https://ingrid-oss.eu/latest/contributing/partner/)
    features:
      - Web-Portal für Recherche und Volltextsuche
      - Metadateneditor (InGrid Editor / IGE) für ISO 19115/19119, OGC- und INSPIRE-konforme Metadaten
      - Open-Data-Erfassung und -Bereitstellung im DCAT-AP.DE-Format
      - Erfassung und Publikation von UVP-Verfahren
      - Kartenvisualisierung über OGC Web Map Services
      - Zeitreihen-Client (OGC SensorThings API)
      - Standardisierte Schnittstellen (OGC CSW, OpenSearch)
      - Harvester zur Anbindung externer Datenquellen

